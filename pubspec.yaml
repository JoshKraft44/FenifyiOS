name: fenify
description: A Flutter application that analyzes chess positions from screenshots.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.5
  flutter_chess_board: ^1.0.1
  
  # Image handling
  image_picker: ^0.8.6
  image: ^4.0.17
  
  # Chess engine
  stockfish_chess_engine: ^0.8.2

  dartchess: ^0.9.0
  chessground: ^6.3.0
  fast_immutable_collections: ^10.2.4

  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  flutter_svg: ^2.0.7

  tflite_flutter: ^0.10.1
  
  # HTTP client
  http: ^1.5.0

  # OpenCV for enhanced board detection
  opencv_dart: ^1.2.0



  chess: any
dev_dependencies:

  flutter_test:
    sdk: flutter

  test: ^1.24.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  fake_async: ^1.3.0
  integration_test:
    sdk: flutter

  flutter_lints: ^2.0.1
  flutter_launcher_icons: ^0.13.1



# App icon
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/icon.png"
  remove_alpha_ios: true


flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/images/
    - assets/piece_classifier.tflite
    - assets/piece_labels.txt
    - assets/pieces/